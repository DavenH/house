stairs:
  main_stair:
    spaces:
      lower: L1.stair
      upper: L2.stair
    width: 4
    lower_entry:
      from: hall
      side: south
      position: east
      kind: arch
      width: 3.5
    upper_exit:
      to: upper_landing
      side: south
      position: west
      kind: arch
      width: 3.5
    layout:
      mode: solve
      hug: perimeter
      preferred_shape: u
      turn_landings: flat
      winders: false
    steps:
      target:
        rise_in: 7
        run_in: 13
      limits:
        rise_in:
          - 6.5
          - 8
        run_in:
          - 10
          - 14
      min_treads_per_run: 2
