foundations:
  F1:
    title: 'Concrete Pad'
    source_level: L1
    masses:
      - shared_body
    insulation_margin: 4
    footing_width: 2
    pad_rebar_spacing: 2
    pad_rebar_edge_cover: 0.1667
stairs:
  main_stair:
    spaces:
      lower: L1.stair
      upper: L2.stair
    width: 4
    lower_entry:
      from: hall
      side: south
      position: east
      kind: arch
      width: 3.5
    upper_exit:
      to: upper_landing
      side: south
      position: west
      kind: arch
      width: 3.5
    layout:
      mode: solve
      hug: perimeter
      preferred_shape: u
      turn_landings: flat
      winders: false
    steps:
      target:
        rise_in: 7
        run_in: 13
      limits:
        rise_in:
          - 6.5
          - 8
        run_in:
          - 10
          - 11.5
      min_treads_per_run: 2
stacks:
  - {id: tower_stack, members: [L1.tower_closet, L2.tower, L3.tower], same: [x, y, w, h]}
  - {id: stair_stack, members: [L1.stair, L2.stair], same: [x, y, w, h]}
