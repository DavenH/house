type: intent_plan
imports:
  - shared-structural.yaml
plan: master-south-no-dining
roof:
  eave_margin: 1.5
structural:
  bearing:
    point_loads:
      -
        id: hearth_chimney
        kind: masonry_mass
        level: L1
        at:
          - 43
          - 17
        size:
          - 6
          - 2
        height_ft: 20
        material: brick_masonry
    line_loads:
      -
        id: tower_brick_walls
        kind: masonry_perimeter
        level: L1
        space: tower_closet
        height_ft: 30
        wall_thickness_in: 8
        material: brick_masonry
    slab_zones:
      -
        id: hearth_pad
        level: L1
        at:
          - 43
          - 17
        size:
          - 6
          - 2
        reason: 'masonry hearth/chimney bearing'
      -
        id: tower_pad
        level: L1
        space: tower_closet
        reason: 'masonry tower bearing'
notes:
  - 'Opinionated optimization variant of the studio/library/piano wing.'
  - 'Keeps the no-basement storage strategy intact while making circulation space do double duty where there are real wall stubs.'
  - 'Splits the former office/library into a real west library/study and an east gallery spine; bathroom circulation now runs on the stair side instead of through the room.'
  - 'The piano remains visible from the library/studio overlap, but the bookable wall area is protected from bathroom traffic.'
  - 'The former hearth/gallery bay at the stair side remains enclosed storage; the right-side storage pocket is absorbed back into the great room.'
  - 'Pattern basis: Library, Music Practice Rooms, Alcoves, Half-Open Wall, Intimacy Gradient, and Light on Two Sides of Every Room.'
  - 'Upper-floor experiment: master bedroom moves into the south gable bay, while the old west bedroom becomes a gym/flex room.'
  - 'The master suite route becomes bedroom -> closet -> ensuite, with the former foyer area absorbed into the bedroom as an entry zone.'
  - 'The second-floor tower is treated as stair circulation up to the nest, not as storage.'
  - 'Variant: removes the dining projection and mirrors the right gable northward across the main ridge.'
datums:
  x: {west: 5.5, storage_e: 8, left_w: 5.5, closet_w: 16.5, gallery_w: 15, left_e: 20.5, stair_w: 26.5, stair_e: 38, piano_w: 29.5, tower_e: 38, right_w: 38, suite_hall_e: 43, pantry_w: 53, room_split: 47.5, suite_closet_split: 49.5, pantry_e: 57, dining_w: 56, right_e: 56, east_projection_e: 63.5, e: 31.5}
  y: {right_gable_n: -2, gable_n: 4.5, main_n: 8, ensuite_s: 7, bath_s: 14, l2_public_bath_n: 12.5, pool_room_s: 12.5, stair_s: 18, kid_room_1_s: 14, kid_room_split: 18.5, kid_room_3_n: 22.5, suite_bedroom_n: 17, east_projection_n: 17.5, closet_s: 18, kitchen_dining_n: 27.5, public_split: 23, lower_storage_n: 25.5, entry_s: 28, terrace_s: 40.5, main_ridge: 18, east_projection_s: 28, tower_s: 30, master_bedroom_s: 33, gable_s: 32, main_s: 40.5}
masses:
  shared_body:
    levels:
      - L1
      - L2
      - L3
    rects:
      - {id: main_gable, levels: [L1], roof: {mode: open_gable, eave_height: 17.5, ridge: x, ends: [hip, hip]}, x: [west, right_e], y: [main_n, entry_s]}
      - {id: left_gable, levels: [L1, L2], roof: {mode: open_gable, eave_height: 17.5, ridge: y}, x: [left_w, left_e], y: [gable_n, gable_s]}
      - {id: stair_core, levels: [L2], roof: {enabled: false}, x: [left_e, right_w], y: [main_n, public_split]}
      - {id: right_wing_lower, levels: [L1], roof: {enabled: false}, x: [right_w, right_e], y: [right_gable_n, main_s]}
      - {id: right_gable, levels: [L2], roof: {mode: open_gable, eave_height: 17.5, ridge: y, eaves: [north, east, south, west]}, x: [right_w, right_e], y: [right_gable_n, master_bedroom_s]}
      - {id: tower, roof: {mode: hip, eave_height: 30}, x: [e, tower_e], y: [public_split, tower_s]}
