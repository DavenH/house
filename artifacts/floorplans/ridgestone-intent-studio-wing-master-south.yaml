notes:
  - 'Opinionated optimization variant of the studio/library/piano wing.'
  - 'Keeps the no-basement storage strategy intact while making circulation space do double duty where there are real wall stubs.'
  - 'Splits the former office/library into a real west library/study and an east gallery spine; bathroom circulation now runs on the stair side instead of through the room.'
  - 'The piano remains visible from the library/studio overlap, but the bookable wall area is protected from bathroom traffic.'
  - 'The former hearth/gallery bay at the stair side remains enclosed storage; the right-side storage pocket is absorbed back into the great room.'
  - 'Pattern basis: Library, Music Practice Rooms, Alcoves, Half-Open Wall, Intimacy Gradient, and Light on Two Sides of Every Room.'
  - 'Upper-floor experiment: master bedroom moves into the south gable bay, while the old west bedroom becomes a gym/flex room.'
  - 'The master suite route becomes bedroom -> closet -> ensuite, with the former foyer area absorbed into the bedroom as an entry zone.'
  - 'The second-floor tower is treated as stair circulation up to the nest, not as storage.'
